name: validate
# Deterministic checks only. The sanitization scan has its own workflow (leak-scan.yml) because it needs a
# denylist kept outside the repository.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install pyyaml python-docx
      - name: Every SKILL.md has valid frontmatter
        run: python3 scripts/validate-skills.py
      - name: story-to-test-workflow validator regression tests
        working-directory: story-to-test-workflow/scripts
        run: |
          python3 test-validate-package.py
          python3 test-merge-specific.py
          python3 test-workflow-routing.py
      - name: refinement-judge regression tests
        working-directory: refinement-judge/scripts
        run: python3 test-validate-judge.py
      - name: build-refinement-document regression tests (needs python-docx, installed above)
        working-directory: build-refinement-document/scripts
        run: python3 test-build-refinement-document.py
      - name: sync-refinement-package-notion script tests (offline, Node)
        working-directory: sync-refinement-package-notion/scripts
        run: |
          set -e
          for f in test-*.mjs; do echo "== $f"; node "$f"; done
      - name: signal-to-ship validator runs on its own template (Node)
        run: node signal-to-ship/scripts/validate-state.mjs signal-to-ship/templates/signal-to-ship-state.md
